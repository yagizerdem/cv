name: ci
run-name: ${{ github.actor }} is running private CI
on:
  workflow_dispatch:

env:
  PHONE_NUMBER: ${{ secrets.PHONE_NUMBER }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-fonts-recommended

      - name: cv-en
        run: |
          python -c "
          import re
          with open('en-cv.tex', 'r', encoding='utf-8') as file:
              content = file.read()
          content = re.sub(r'PHONE-PLACEHOLDER\s*\$\|\$\s*', '', content)
          with open('processed-en-cv.tex', 'w', encoding='utf-8') as f:
              f.write(content)
          "

      - name: cv-tr
        run: |
          python -c "
          import re
          with open('tr-cv.tex', 'r', encoding='utf-8') as file:
              content = file.read()
          content = re.sub(r'PHONE-PLACEHOLDER\s*\$\|\$\s*', '', content)
          with open('processed-tr-cv.tex', 'w', encoding='utf-8') as f:
              f.write(content)
          "

      - name: Rename PDFs
        run: |
          mv dist/processed-en-cv.pdf dist/cv-en.pdf
          mv dist/processed-tr-cv.pdf dist/cv-tr.pdf

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release cv-latest \
            --latest \
            --title "Latest CV" \
            --notes "Automatically generated CV PDFs."

          gh release cv-latest \
            dist/cv-en.pdf \
            dist/cv-tr.pdf \
            --clobber

  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: publish
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@1
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          projectName: cv
          directory: ./public
          gitHubToken: ${{ env.GITHUB_TOKEN }}
